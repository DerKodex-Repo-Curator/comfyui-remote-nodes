[project]
name = "comfyui-remote-nodes"
description = "Execute workflows on remote ComfyUI servers. Supports image, text, audio, and video input/output."
version = "1.0.0"
license = {file = "LICENSE"}
# classifiers = [
#     "Operating System :: OS Independent",
#     "Environment :: GPU :: NVIDIA CUDA",
#     "Environment :: GPU :: AMD ROCm",
#     "Environment :: GPU :: Apple Metal",
# ]

dependencies = ["requests>=2.28.0", "numpy>=1.21.0", "Pillow>=9.0.0", "torch>=1.12.0", "torchaudio>=0.12.0", "websocket-client>=1.4.0", "opencv-python>=4.6.0"]

[project.urls]
Repository = "https://github.com/DerKodex-Repo-Curator/comfyui-remote-nodes"
Documentation = "https://github.com/DerKodex-Repo-Curator/comfyui-remote-nodes#readme"
"Bug Tracker" = "https://github.com/DerKodex-Repo-Curator/comfyui-remote-nodes/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.comfy]
PublisherId = "derkodex"
DisplayName = "comfyui-remote-nodes"
Icon = ""
includes = []
